openapi: 3.0.3
info:
  title: Edge AI Catalog — Device Agent Local API
  version: "0.1.0"
  description: >
    Tier 3 local-only API served by the Device Agent on each edge device.
    The Storefront SPA (running in the browser, on the same device) talks
    to this API over an HTTPS loopback binding — see
    `edge-ai-catalog-design.md` §3.1.1 for the full cert/PNA mechanism,
    which is DEFERRED / not yet finalized. This spec documents the
    intended request/response contract only; it does NOT resolve the
    loopback trust/cert-provisioning decision. Every operation here has a
    documented TP1 manual-CLI fallback in `technical-flows.md` (flows
    D2-D5) for use before the Device Agent ships.

    NOTE on the install/upgrade model: the browser only ever relays an
    opaque, short-lived, single-use `install_token` — it never carries the
    actual install payload. The Device Agent redeems that token itself,
    over its own normal OUTBOUND HTTPS call to the Catalog Service
    (`GET /install/redeem/{installToken}` in catalog-service.openapi.yaml,
    ordinary public-CA TLS, no custom PKI/signing). This keeps the loopback
    leg simple (just relay a meaningless-if-stolen token) and avoids
    needing KMS-based manifest signing + public-key provisioning to every
    device.
servers:
  - url: "https://127.0.0.1:{port}/local/v1"
    description: Loopback-only; port and cert are provisioned per design §3.1.1
    variables:
      port:
        default: "17463"

security:
  - originHeader: []

tags:
  - name: profile
  - name: lifecycle

paths:
  /system-profile:
    get:
      tags: [profile]
      summary: Report local hardware/OS profile for compatibility checks (flow D2 step 2)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemProfile" }
        "403":
          description: Origin header did not match the expected Storefront origin (defense-in-depth check, design §3.1.1)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /install:
    post:
      tags: [lifecycle]
      summary: >
        Accept an opaque install token from the browser, redeem it directly
        against the Catalog Service (own outbound HTTPS call, not shown to
        the browser), then pull images and start the app (flow D2 steps 5-8).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallTokenRequest" }
      responses:
        "202":
          description: Accepted — install running asynchronously
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallJob" }
        "400":
          description: Malformed request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Token redeem failed — expired, already consumed, or unknown (flow D2 step 6 error case)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            Local compatibility re-check failed (hardware_requirements not
            met, or app already installed) — Device Agent re-validates
            independently of the server-side advisory check (flow D2 step 6)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Redeemed plan has unfilled fill_at_install settings — response
            body carries `needs_input`; caller should prompt the SI and
            re-call /install with a freshly-issued token (the first token
            is already consumed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NeedsInputResponse" }

  /upgrade:
    post:
      tags: [lifecycle]
      summary: Upgrade an installed app using a new install token (flow D3 steps 2-3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallTokenRequest" }
      responses:
        "202":
          description: Accepted — upgrade running asynchronously
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallJob" }
        "404":
          description: App is not currently installed (nothing to upgrade)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Token redeem failed — expired, already consumed, or unknown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Local compatibility re-check failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /uninstall:
    post:
      tags: [lifecycle]
      summary: >
        Stop and remove an installed app and its resources (flow D4 steps
        2-4). Purely local — no token needed, does not reach Catalog Service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id]
              properties:
                app_id: { type: string, format: uuid }
                purge_volumes:
                  type: boolean
                  default: false
                  description: Also remove persistent app data volumes
      responses:
        "202":
          description: Accepted — uninstall running asynchronously
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallJob" }
        "404":
          description: App is not currently installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /installed-apps:
    get:
      tags: [lifecycle]
      summary: List apps currently installed on this device (flow D5 step 1)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InstalledApp" }

  /install/{jobId}/status:
    get:
      tags: [lifecycle]
      summary: Poll async install/upgrade/uninstall job status (flows D2 step 8, D3 step 3, D4 step 3)
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallJob" }
        "404":
          description: Unknown job id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    originHeader:
      type: apiKey
      in: header
      name: Origin
      description: >
        Device Agent validates the browser-supplied Origin header matches
        the known Storefront origin as defense-in-depth, in addition to
        TLS/cert trust and (where applicable) Private Network Access
        preflight — see design §3.1.1. This is NOT a substitute for the
        underlying loopback cert mechanism, which is still under decision.
        Since the token itself is opaque and single-use, a malicious local
        page hitting this port at worst triggers a redeem of a token it
        doesn't possess — it cannot forge or replay a valid install.

  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

    SystemProfile:
      type: object
      properties:
        os: { type: string, example: "Ubuntu 22.04" }
        edge_pack_version: { type: string }
        cpu: { type: string }
        gpu: { type: string, nullable: true }
        npu: { type: boolean }
        memory_gb: { type: integer }
        device_agent_version: { type: string }

    InstallTokenRequest:
      type: object
      required: [install_token]
      properties:
        install_token:
          type: string
          description: >
            Opaque, single-use, short-lived token issued by the Catalog
            Service's POST /install (or /upgrade path re-uses the same
            issuance flow). The Device Agent redeems this itself against
            `GET /install/redeem/{installToken}` — see
            catalog-service.openapi.yaml — before proceeding.
        settings_overrides:
          type: array
          description: Values for fill_at_install settings collected from the SI on a retry
          items:
            type: object
            properties:
              env_key: { type: string }
              value: { type: string }

    NeedsInputResponse:
      type: object
      properties:
        needs_input:
          type: array
          items:
            type: object
            properties:
              env_key: { type: string }
              description: { type: string }

    InstallJob:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        app_id: { type: string, format: uuid }
        action: { type: string, enum: [install, upgrade, uninstall] }
        state:
          type: string
          enum: [queued, redeeming_token, pulling_images, starting, running, completed, failed, rolled_back]
        progress_pct: { type: integer, minimum: 0, maximum: 100 }
        error_message: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    InstalledApp:
      type: object
      properties:
        app_id: { type: string, format: uuid }
        app_version_id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        icon_url: { type: string, format: uri }
        installed_at: { type: string, format: date-time }
        state: { type: string, enum: [running, stopped, error] }
        launch_url:
          type: string
          format: uri
          nullable: true
          description: >
            NOTE — no equivalent field exists in the source MVP docs today;
            recommended addition so the SI has a way to "launch" the app
            post-install (see technical-flows.md open items).
